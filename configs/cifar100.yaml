# CIFAR-100 FedRL experiment
dataset: cifar100
model: resnet                         # ResNetFed — same architecture as cifar10, output head = 100
results_dir: results_for_runs_cifar100
clients_per_round: [5, 10, 20, 30]
num_clients: 100
num_rounds: 200
alpha: 0.5                            # KL divergence balancing factor
beta: 0.3                             # Participation frequency balancing factor
reward_formula: full                  # full | simple
use_target_network: false
save_checkpoints: true
dirichlet_alpha: 0.5                  # Dirichlet concentration for non-IID partition
